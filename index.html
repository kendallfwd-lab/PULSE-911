<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102A43" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('pulse911-theme')
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme

          const storedTextSize = localStorage.getItem('pulse911-text-size')
          document.documentElement.dataset.textSize = ['normal', 'large', 'xlarge'].includes(storedTextSize)
            ? storedTextSize
            : 'normal'

          const storedColorVision = localStorage.getItem('pulse911-color-vision')
          document.documentElement.dataset.colorVision = ['standard', 'protanopia', 'deuteranopia', 'tritanopia', 'high-contrast'].includes(storedColorVision)
            ? storedColorVision
            : 'standard'
        } catch {}
      })()
    </script>
    <meta name="description" content="PULSE 911 — demostración educativa de coordinación de emergencias." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23081a2b'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23c62828'/%3E%3Cpath d='M28 20h8v8h8v8h-8v8h-8v-8h-8v-8h8z' fill='white'/%3E%3C/svg%3E" />
    <title>PULSE 911 — Command Center · Versión Final</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
